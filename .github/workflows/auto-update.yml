name: Fenix Auto Update & Build

"on":
  schedule:
    - cron: '0 3 * * *' # Täglich um 03:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Erzwinge Build auch ohne neuen Upstream-Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Merge Upstream Mozilla Releases
        id: upstream-check
        run: |
          git remote add upstream https://github.com/mozilla-firefox/firefox.git || true
          git fetch upstream --tags

          # Neuesten stabilen FIREFOX-ANDROID Release-Tag finden (ohne Beta 'b', Alpha 'a')
          LATEST_TAG=$(git tag -l "FIREFOX-ANDROID_*_RELEASE" | grep -v "[0-9]b" | sort -V | tail -n 1)
          echo "Neuester Upstream Release Tag: $LATEST_TAG"

          SHOULD_BUILD="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow manuell ausgelöst -> Build wird durchgeführt."
            SHOULD_BUILD="true"
          fi

          if [ -n "$LATEST_TAG" ]; then
            if ! git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
              echo "Neuerer Upstream-Release gefunden: $LATEST_TAG. Versuche automatischen Merge..."
              if git merge "$LATEST_TAG" -m "chore: merge upstream release $LATEST_TAG"; then
                echo "Merge erfolgreich."
                git push origin HEAD || true
                SHOULD_BUILD="true"
              else
                echo "Konflikt beim Upstream-Merge! Breche Merge ab."
                git merge --abort || true
                exit 1
              fi
            else
              echo "Branch ist bereits auf dem Stand von $LATEST_TAG oder neuer."
            fi
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        if: steps.upstream-check.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.upstream-check.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Mozilla Mach Environment
        if: steps.upstream-check.outputs.should_build == 'true'
        run: |
          VERSION=$(cat browser/config/version.txt | tr -d '\r\n')
          echo "MOZ_APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p objdir-android obj-x86_64-pc-linux-gnu

          python3 -m venv $GITHUB_WORKSPACE/objdir-android/_glean_venv
          $GITHUB_WORKSPACE/objdir-android/_glean_venv/bin/pip install "glean_parser~=20.0"
          ln -sfn $GITHUB_WORKSPACE/objdir-android/_glean_venv $GITHUB_WORKSPACE/obj-x86_64-pc-linux-gnu/_glean_venv

          cat << EOF > config.status.json
          {
            "topsrcdir": "$GITHUB_WORKSPACE",
            "topobjdir": "$GITHUB_WORKSPACE/obj-x86_64-pc-linux-gnu",
            "substs": {
              "MOZ_BUILD_APP": "mobile/android",
              "MOZ_APP_VERSION": "$VERSION",
              "MOZ_UPDATE_CHANNEL": "release",
              "MOZILLA_OFFICIAL": true,
              "MOZ_ANDROID_FAT_AAR_ARCHITECTURES": ["arm64-v8a", "x86_64"],
              "ANDROID_CPU_ARCH": "arm64-v8a",
              "MOZ_ANDROID_GECKOVIEW_LITE": false,
              "ANDROID_NDK_MAJOR_VERSION": "29",
              "ANDROID_NDK_MINOR_VERSION": "0",
              "ANDROID_BUILD_TOOLS_VERSION": "36.0.0",
              "ANDROID_TARGET_SDK": "37",
              "ANDROID_COMPILE_SDK_MAJOR": "37",
              "ANDROID_COMPILE_SDK_MINOR": "1",
              "MOZ_ANDROID_MIN_SDK_VERSION": "26",
              "MOZ_APPSERVICES_IN_TREE": false,
              "GRADLE_MAVEN_REPOSITORIES": [
                "https://repo.maven.apache.org/maven2/",
                "https://maven.google.com/",
                "https://plugins.gradle.org/m2/",
                "https://maven.mozilla.org/maven2/"
              ],
              "ALLOW_INSECURE_GRADLE_REPOSITORIES": false,
              "MOZ_ANDROID_DEBUGGABLE": false,
              "GRADLE_GLEAN_PARSER_VENV": "$GITHUB_WORKSPACE/objdir-android/_glean_venv",
              "DOWNLOAD_ALL_GRADLE_DEPENDENCIES": false,
              "MOZ_INCLUDE_SOURCE_INFO": false,
              "MOZ_CRASHREPORTER": false
            }
          }
          EOF
          cp config.status.json objdir-android/config.status.json
          cp config.status.json obj-x86_64-pc-linux-gnu/config.status.json

          # Offizielle GeckoView Build-ID von Mozilla Maven auflösen
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          GECKO_VERSION=$(curl -s "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml" | grep -o "<version>${MAJOR_MINOR}\.[0-9]*</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n 1)
          if [ -z "$GECKO_VERSION" ]; then
            echo "Warnung: Kein exakter Match fuer $MAJOR_MINOR. Suche nach neuestem stabilen Build..."
            GECKO_VERSION=$(curl -s "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml" | grep -o "<version>[0-9]*\.[0-9]*\.[0-9]*</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n 1)
          fi
          echo "Gefundene GeckoView-Version: $GECKO_VERSION"
          BUILD_DATE=$(echo "$GECKO_VERSION" | cut -d. -f3)
          echo "Verwende Build-ID: $BUILD_DATE"

          echo "MOZ_BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "#define MOZ_BUILDID $BUILD_DATE" > buildid.h
          cp buildid.h objdir-android/buildid.h
          cp buildid.h obj-x86_64-pc-linux-gnu/buildid.h

          # CrashReport.kt fuer lib-crash generieren
          $GITHUB_WORKSPACE/objdir-android/_glean_venv/bin/python - << 'EOF'
          import sys, os, io
          sys.path.insert(0, 'toolkit/crashreporter/annotations')
          import load, generate

          val_yaml = io.StringIO()
          load.main(val_yaml)
          val_yaml.seek(0)
          with open('validated.yaml', 'w') as f:
              f.write(val_yaml.getvalue())

          for obj in ['objdir-android', 'obj-x86_64-pc-linux-gnu']:
              dest = f"{obj}/mobile/android/android-components/components/lib/crash/src/main/java/mozilla/components/lib/crash/service/CrashReport.kt"
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              with open(dest, 'w') as f:
                  generate.main(f, 'validated.yaml')
              print(f"Generiert: {dest} ({os.path.getsize(dest)} Bytes)")
          EOF

      - name: Decode Keystore
        if: steps.upstream-check.outputs.should_build == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/fenix/fenix-release.keystore

      - name: Build Fenix APK
        if: steps.upstream-check.outputs.should_build == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOZ_BUILD_DATE: ${{ env.MOZ_BUILD_DATE }}
        run: |
          cd mobile/android/fenix
          chmod +x gradlew
          export KEYSTORE_FILE="$PWD/fenix-release.keystore"
          DATE=$(date +'%Y.%m.%d')
          ./gradlew :app:assembleRelease -PdisableOptimization -PversionName="$DATE"

      - name: Find and Package APK
        if: steps.upstream-check.outputs.should_build == 'true'
        id: package-apk
        run: |
          echo "Suche nach erzeugten APKs..."
          find . -name "*.apk"
          APK=$(find . -path "*/outputs/apk/*" -name "*arm64-v8a*release*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find . -path "*/outputs/apk/*" -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -path "*/outputs/apk/*" -name "*.apk" | grep -v "unaligned" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "Fehler: Kein APK gefunden!"
            exit 1
          fi
          echo "Gefundenes APK: $APK"
          
          DATE=$(date +'%Y.%m.%d')
          TARGET_APK="fenix-${DATE}.apk"
          cp "$APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "release_tag=v${DATE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.upstream-check.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package-apk.outputs.release_tag }}"
          APK="${{ steps.package-apk.outputs.apk_path }}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fenix Release $TAG" \
            --notes "Basiert auf Mozilla Firefox $MOZ_APP_VERSION"

      - name: Cleanup Old Releases (Keep Last 3)
        if: steps.upstream-check.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[3:][].tagName')
          for r in $OLD_RELEASES; do
            echo "Entferne altes Release: $r"
            gh release delete "$r" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          done

