name: Fenix Auto Update & Build

"on":
  schedule:
    - cron: '0 3 1 * *' # Am 1. jedes Monats um 03:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Erzwinge Build auch ohne neuen Upstream-Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Merge Upstream Mozilla Releases
        id: upstream-check
        run: |
          git remote add upstream https://github.com/mozilla-firefox/firefox.git || true
          git fetch upstream --tags

          # Neuesten stabilen FIREFOX-ANDROID Release-Tag finden (ohne Beta 'b', Alpha 'a')
          LATEST_TAG=$(git tag -l "FIREFOX-ANDROID_*_RELEASE" | grep -v "[0-9]b" | sort -V | tail -n 1)
          echo "Neuester Upstream Release Tag: $LATEST_TAG"

          if [ -n "$LATEST_TAG" ]; then
            if ! git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
              echo "Neuerer Upstream-Release gefunden: $LATEST_TAG. Versuche automatischen Merge..."
              if git merge "$LATEST_TAG" -m "chore: merge upstream release $LATEST_TAG"; then
                echo "Merge erfolgreich."
                git push origin HEAD || true
              else
                echo "Konflikt beim Upstream-Merge! Breche Merge ab und baue aktuellen Stand..."
                git merge --abort || true
              fi
            else
              echo "Branch ist bereits auf dem Stand von $LATEST_TAG oder neuer."
            fi
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Mozilla Mach Environment
        run: |
          VERSION=$(cat browser/config/version.txt | tr -d '\r\n')
          echo "MOZ_APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p objdir-android obj-x86_64-pc-linux-gnu
          cat << EOF > config.status.json
          {
            "topsrcdir": "$GITHUB_WORKSPACE",
            "topobjdir": "$GITHUB_WORKSPACE/obj-x86_64-pc-linux-gnu",
            "substs": {
              "MOZ_BUILD_APP": "mobile/android",
              "MOZ_APP_VERSION": "$VERSION",
              "MOZ_UPDATE_CHANNEL": "release",
              "MOZILLA_OFFICIAL": true,
              "MOZ_ANDROID_FAT_AAR_ARCHITECTURES": ["arm64-v8a", "x86_64"],
              "ANDROID_CPU_ARCH": "arm64-v8a",
              "MOZ_ANDROID_GECKOVIEW_LITE": false,
              "ANDROID_NDK_MAJOR_VERSION": "29",
              "ANDROID_NDK_MINOR_VERSION": "0",
              "ANDROID_BUILD_TOOLS_VERSION": "36.0.0",
              "ANDROID_TARGET_SDK": "37",
              "ANDROID_COMPILE_SDK_MAJOR": "37",
              "ANDROID_COMPILE_SDK_MINOR": "1",
              "MOZ_ANDROID_MIN_SDK_VERSION": "26",
              "MOZ_APPSERVICES_IN_TREE": false,
              "GRADLE_MAVEN_REPOSITORIES": [
                "https://repo.maven.apache.org/maven2/",
                "https://maven.google.com/",
                "https://plugins.gradle.org/m2/",
                "https://maven.mozilla.org/maven2/"
              ],
              "ALLOW_INSECURE_GRADLE_REPOSITORIES": false,
              "MOZ_ANDROID_DEBUGGABLE": false,
              "DOWNLOAD_ALL_GRADLE_DEPENDENCIES": false,
              "MOZ_INCLUDE_SOURCE_INFO": false,
              "MOZ_CRASHREPORTER": false
            }
          }
          EOF
          cp config.status.json objdir-android/config.status.json
          cp config.status.json obj-x86_64-pc-linux-gnu/config.status.json

          BUILD_DATE=$(date +'%Y%m%d%H%M%S')
          echo "MOZ_BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "#define MOZ_BUILDID $BUILD_DATE" > buildid.h
          cp buildid.h objdir-android/buildid.h
          cp buildid.h obj-x86_64-pc-linux-gnu/buildid.h

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/fenix/fenix-release.keystore

      - name: Build Fenix APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOZ_BUILD_DATE: ${{ env.MOZ_BUILD_DATE }}
        run: |
          cd mobile/android/fenix
          chmod +x gradlew
          export KEYSTORE_FILE="$PWD/fenix-release.keystore"
          ./gradlew :app:assembleRelease -PdisableOptimization

      - name: Find and Package APK
        id: package-apk
        run: |
          APK=$(find mobile/android/fenix/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Fehler: Kein APK gefunden!"
            exit 1
          fi
          echo "Gefundenes APK: $APK"
          
          DATE=$(date +'%Y.%m.%d')
          TARGET_APK="fenix-${DATE}.apk"
          cp "$APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "release_tag=v${DATE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package-apk.outputs.release_tag }}"
          APK="${{ steps.package-apk.outputs.apk_path }}"
          gh release create "$TAG" "$APK" \
            --title "Fenix Release $TAG" \
            --notes "Basiert auf Mozilla Firefox $MOZ_APP_VERSION"

      - name: Cleanup Old Releases (Keep Last 3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[3:][].tagName')
          for r in $OLD_RELEASES; do
            echo "Entferne altes Release: $r"
            gh release delete "$r" -y --cleanup-tag || true
          done
